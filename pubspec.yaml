name: mosul_scanner
description: "A professional document scanning and printing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # واجهة المستخدم
  cupertino_icons: ^1.0.6

  # معالجة الصور
  image: ^4.1.7
  image_picker: ^1.1.2
  
  # الطباعة والـ PDF
  pdf: ^3.11.1
  printing: ^5.12.0

  # محرك القص الهندسي (لتسطيح الصورة)
  opencv_dart: ^1.0.0

  # مكتبة الذكاء الاصطناعي لقراءة الموديل
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مسار ملف الذكاء الاصطناعي الذي قمت برفعه
  assets:
    - assets/border_detect_224.tflite
