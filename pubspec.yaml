name: mosul_scanner
description: "Mosul Scanner - نظام مسح وطباعة المستندات الاحترافي"
publish_to: "none"
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # واجهة الأيقونات الافتراضية من Flutter
  cupertino_icons: ^1.0.6

  # معالجة الصور (تدوير، قص، تحسين، ترميز JPEG)
  image: ^4.0.17

  # ماسح المستندات الجاهز من Google ML Kit (أندرويد فقط) - المصدر
  # الوحيد لالتقاط/استيراد الصور بالنسخة الحالية من الكود.
  google_mlkit_document_scanner: ^0.4.0

  # بناء وتصدير ملفات PDF
  pdf: ^3.10.7

  # الطباعة ومعاينة PDF
  printing: ^5.11.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true
