name: mosul_scanner
description: "A professional document scanning and printing application."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # واجهة المستخدم الأساسية
  cupertino_icons: ^1.0.6

  # مكتبات معالجة الصور وجلبها من المعرض/الكاميرا
  image: ^4.1.7
  image_picker: ^1.1.2
  
  # مكتبات إنشاء وطباعة ملفات الـ PDF
  pdf: ^3.11.1
  printing: ^5.12.0

  # مكتبة التحويل الهندسي الدقيق للقص (لتسطيح البطاقات المائلة)
  opencv_dart: ^1.0.0

  # الذكاء الاصطناعي المدمج (لاكتشاف زوايا المستند بذكاء بشري)
  tflite_flutter: ^0.10.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

flutter:
  uses-material-design: true

  # مسار ملفات الذكاء الاصطناعي
  assets:
    - assets/models/document_scanner.tflite
