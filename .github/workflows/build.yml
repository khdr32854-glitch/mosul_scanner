name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mosul Scanner APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. Checkout
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4

      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # =========================================================
      # 3. Flutter Stable
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # =========================================================
      # 4. Verify Flutter
      # =========================================================
      - name: Flutter Version
        run: |
          flutter --version
          flutter doctor -v

      # =========================================================
      # 5. Verify Project
      # =========================================================
      - name: Verify Project
        run: |
          echo "=========================================="
          echo "PROJECT"
          echo "=========================================="

          test -f pubspec.yaml
          test -d lib
          test -f lib/main.dart
          test -f lib/crop_engine.dart

          echo "Project files OK."

          echo ""
          echo "=========================================="
          echo "ANDROID"
          echo "=========================================="

          test -d android
          test -f android/app/src/main/AndroidManifest.xml

          echo "Android folder OK."
          echo "AndroidManifest.xml OK."

          echo ""
          echo "Searching for MainActivity..."

          find android/app/src/main -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print

          if ! find android/app/src/main -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            | grep -q "MainActivity"; then
            echo "ERROR: MainActivity not found!"
            exit 1
          fi

          echo "MainActivity OK."

      # =========================================================
      # 6. Configure Camera Permission
      # =========================================================
      - name: Configure Camera Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission android:name="android.permission.CAMERA"/>'
          )

          if permission not in text:
              marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'

              if marker in text:
                  text = text.replace(
                      marker,
                      marker + '\n\n    ' + permission,
                      1
                  )
              else:
                  print("WARNING: Manifest marker not found.")

          manifest.write_text(text)

          print("Camera permission configured.")
          PY

      # =========================================================
      # 7. Show Manifest
      # =========================================================
      - name: Verify Manifest
        run: |
          echo "=========================================="
          echo "ANDROID MANIFEST"
          echo "=========================================="

          cat android/app/src/main/AndroidManifest.xml

          echo ""
          echo "Checking manifest..."

          grep -q "android.permission.CAMERA" \
            android/app/src/main/AndroidManifest.xml

          echo "Manifest OK."

      # =========================================================
      # 8. Clean
      # =========================================================
      - name: Clean Flutter
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      # =========================================================
      # 9. Get Dependencies
      # =========================================================
      - name: Get Dependencies
        run: |
          flutter pub get

      # =========================================================
      # 10. Dependencies
      # =========================================================
      - name: Check Dependencies
        run: |
          flutter pub deps

      # =========================================================
      # 11. Verify ML Kit
      # =========================================================
      - name: Verify ML Kit
        run: |
          echo "Checking Google ML Kit Document Scanner..."

          flutter pub deps | grep google_mlkit_document_scanner

          echo "ML Kit dependency found."

      # =========================================================
      # 12. Analyze
      # =========================================================
      - name: Analyze
        run: |
          flutter analyze

      # =========================================================
      # 13. Build APK
      # =========================================================
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # =========================================================
      # 14. Verify APK
      # =========================================================
      - name: Verify APK
        run: |
          echo "=========================================="
          echo "APK"
          echo "=========================================="

          ls -lh build/app/outputs/flutter-apk/

          test -f \
            build/app/outputs/flutter-apk/app-release.apk

          echo "APK created successfully."

      # =========================================================
      # 15. Upload APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mosul-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
