name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mosul Scanner APK
    runs-on: ubuntu-latest

    steps:

      # 1. تنزيل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. Flutter Stable
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. التحقق من ملفات المشروع
      - name: Verify Project
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== LIB ====="
          ls -la lib

          echo "===== PUBSPEC ====="
          cat pubspec.yaml

          echo "===== ANDROID ====="
          test -d android
          test -f android/app/src/main/AndroidManifest.xml

          echo "Project structure OK."

      # 5. تنظيف Flutter
      - name: Clean Flutter
        run: |
          flutter clean
          rm -rf .dart_tool
          rm -rf build

      # 6. تحميل Dependencies
      - name: Get Dependencies
        run: |
          flutter pub get

      # 7. التأكد من المكتبات
      - name: Check Dependencies
        run: |
          flutter pub deps

      # 8. التحقق من Google ML Kit
      - name: Verify ML Kit
        run: |
          flutter pub deps | grep google_mlkit_document_scanner
          test -f lib/crop_engine.dart
          test -f lib/main.dart

      # 9. Flutter Doctor
      - name: Flutter Doctor
        run: |
          flutter --version
          flutter doctor -v

      # 10. تحليل المشروع
      - name: Analyze
        run: |
          flutter analyze

      # 11. بناء APK
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons

      # 12. التأكد من APK
      - name: Verify APK
        run: |
          echo "===== APK ====="
          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK CREATED SUCCESSFULLY."

      # 13. رفع APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mosul-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
