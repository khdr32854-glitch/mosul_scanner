name: build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mosul Scanner APK
    runs-on: ubuntu-latest

    steps:

      # 1. تحميل المشروع
      - name: Checkout
        uses: actions/checkout@v4

      # 2. إعداد Java
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      # 3. إعداد Flutter
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # 4. بناء ملفات الأندرويد الناقصة
      - name: Prepare Android Project
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then
            flutter create --platforms=android --org=com.mosul --project-name=mosul_scanner .
          fi

      # 5. تحديث إصدار التطبيق الأساسي إلى 36
      - name: Configure App SDK
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for p in [Path("android/app/build.gradle.kts"), Path("android/app/build.gradle")]:
              if p.exists():
                  text = p.read_text()
                  text = text.replace("compileSdk = flutter.compileSdkVersion", "compileSdk = 36")
                  text = text.replace("compileSdkVersion flutter.compileSdkVersion", "compileSdkVersion 36")
                  p.write_text(text)
          PY

      # 6. إضافة صلاحية الكاميرا
      - name: Configure Camera Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          if manifest.exists():
              text = manifest.read_text()
              perm = '<uses-permission android:name="android.permission.CAMERA"/>'
              if perm not in text:
                  marker = '<manifest xmlns:android="http://schemas.android.com/apk/res/android">'
                  text = text.replace(marker, marker + '\n    ' + perm)
                  manifest.write_text(text)
          PY

      # 7. تنظيف مخلفات Flutter
      - name: Clean Flutter
        run: |
          flutter clean
          rm -rf .dart_tool build test/widget_test.dart

      # 8. تحميل المكتبات الخارجية (مثل opencv_dart)
      - name: Get Dependencies
        run: flutter pub get

      # 9. الخطوة السحرية: تعديل كل المكتبات المحملة لتصبح بإصدار 36 بالقوة
      - name: Patch Plugins SDK
        run: |
          python3 - <<'PY'
          import os, re
          from pathlib import Path
          pub_cache = Path(os.environ.get('PUB_CACHE', os.path.expanduser('~/.pub-cache')))
          if pub_cache.exists():
              for gradle_file in pub_cache.rglob("build.gradle*"):
                  try:
                      text = gradle_file.read_text(encoding="utf-8")
                      new_text = re.sub(r'compileSdkVersion\s+\d+', 'compileSdkVersion 36', text)
                      new_text = re.sub(r'compileSdk\s+\d+', 'compileSdk 36', new_text)
                      new_text = re.sub(r'compileSdk\s*=\s*\d+', 'compileSdk = 36', new_text)
                      if text != new_text:
                          gradle_file.write_text(new_text, encoding="utf-8")
                  except Exception:
                          pass
          PY

      # 10. بناء التطبيق النهائي
      - name: Build APK
        run: flutter build apk --release --no-tree-shake-icons

      # 11. رفع التطبيق للتحميل
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mosul-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
