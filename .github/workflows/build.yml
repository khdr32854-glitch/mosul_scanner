name: Build APK

on:
  push:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Mosul Scanner APK
    runs-on: ubuntu-latest

    steps:

      # =========================================================
      # 1. تحميل المشروع
      # =========================================================
      - name: Checkout
        uses: actions/checkout@v4


      # =========================================================
      # 2. Java 17
      # =========================================================
      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'


      # =========================================================
      # 3. Flutter Stable
      # =========================================================
      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true


      # =========================================================
      # 4. التأكد من ملفات المشروع
      # =========================================================
      - name: Verify Project Files
        run: |
          echo "===== PROJECT ====="
          ls -la

          echo "===== LIB ====="
          ls -la lib

          echo "===== PUBSPEC ====="
          test -f pubspec.yaml

          echo "Project files OK."


      # =========================================================
      # 5. إنشاء Android إذا كان مفقودًا
      # =========================================================
      - name: Prepare Android Project
        run: |
          if [ ! -f android/app/src/main/AndroidManifest.xml ]; then

            echo "Android project not found."
            echo "Creating Android project..."

            flutter create \
              --platforms=android \
              --org=com.mosul \
              --project-name=mosul_scanner \
              .

          else

            echo "Android project already exists."
            echo "Keeping existing Android project."

          fi


      # =========================================================
      # 6. حذف اختبار Flutter الافتراضي
      # =========================================================
      - name: Remove Default Flutter Test
        run: |
          echo "Removing default Flutter test..."

          rm -f test/widget_test.dart

          if [ -d test ] && [ -z "$(ls -A test)" ]; then
            rmdir test
          fi

          echo "Default test removed."


      # =========================================================
      # 7. التأكد من AndroidManifest
      # =========================================================
      - name: Verify Android Project
        run: |
          echo "===== ANDROID ====="

          test -f android/app/src/main/AndroidManifest.xml

          echo "AndroidManifest.xml found."

          echo "===== MAIN ACTIVITY ====="

          find android/app/src/main -type f \
            \( -name "MainActivity.kt" -o -name "MainActivity.java" \) \
            -print

          echo "Android project OK."


      # =========================================================
      # 8. إضافة صلاحية الكاميرا
      # =========================================================
      - name: Configure Camera Permission
        run: |
          python3 - <<'PY'
          from pathlib import Path

          manifest = Path(
              "android/app/src/main/AndroidManifest.xml"
          )

          text = manifest.read_text()

          permission = (
              '<uses-permission android:name="android.permission.CAMERA"/>'
          )

          if permission not in text:
              text = text.replace(
                  '<manifest xmlns:android="http://schemas.android.com/apk/res/android">',
                  '''<manifest xmlns:android="http://schemas.android.com/apk/res/android">

          <uses-permission android:name="android.permission.CAMERA"/>'''
              )

              manifest.write_text(text)

          print("Camera permission configured.")
          PY


      # =========================================================
      # 9. عرض AndroidManifest للفحص
      # =========================================================
      - name: Show Android Manifest
        run: |
          echo "===== ANDROID MANIFEST ====="
          cat android/app/src/main/AndroidManifest.xml


      # =========================================================
      # 10. تنظيف المشروع
      # =========================================================
      - name: Clean Flutter
        run: |
          flutter clean

          rm -rf .dart_tool
          rm -rf build

          echo "Flutter clean completed."


      # =========================================================
      # 11. تحميل المكتبات
      # =========================================================
      - name: Get Dependencies
        run: |
          flutter pub get


      # =========================================================
      # 12. معلومات Flutter
      # =========================================================
      - name: Flutter Version
        run: |
          flutter --version


      # =========================================================
      # 13. فحص الاعتماديات
      # =========================================================
      - name: Check Dependencies
        run: |
          flutter pub deps


      # =========================================================
      # 14. تحليل المشروع
      # =========================================================
      - name: Analyze
        run: |
          flutter analyze


      # =========================================================
      # 15. بناء APK
      # =========================================================
      - name: Build APK
        run: |
          flutter build apk \
            --release \
            --no-tree-shake-icons


      # =========================================================
      # 16. التأكد من APK
      # =========================================================
      - name: Verify APK
        run: |
          echo "===== APK ====="

          ls -lh build/app/outputs/flutter-apk/

          test -f build/app/outputs/flutter-apk/app-release.apk

          echo "APK created successfully."


      # =========================================================
      # 17. رفع APK
      # =========================================================
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Mosul-Scanner-APK
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 7
